name: Sync Production VPS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - docker-compose

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'docker-compose'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$VPS_SSH_KEY" | base64 -d > ~/.ssh/forooghteb_deploy
          chmod 600 ~/.ssh/forooghteb_deploy

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='__pycache__/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='.env' \
            --exclude='media/' \
            -e "ssh -i ~/.ssh/forooghteb_deploy" \
            ./ \
            "$VPS_USER@$VPS_HOST:/opt/MedicalEquipment-Project/"

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/forooghteb_deploy \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/forooghteb-deploy"