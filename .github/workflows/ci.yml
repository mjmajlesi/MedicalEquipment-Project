name: CI

on:
  pull_request:
  push:
    branches:
      - docker-compose

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medical_ci
          POSTGRES_USER: medical_ci
          POSTGRES_PASSWORD: medical_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical_ci -d medical_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: medical_ci
      POSTGRES_USER: medical_ci
      POSTGRES_PASSWORD: medical_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: BackEnd/MEPBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BackEnd/MEPBE/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    name: Production Deployment
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/docker-compose'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$VPS_SSH_KEY" | base64 -d > ~/.ssh/forooghteb_deploy
          chmod 600 ~/.ssh/forooghteb_deploy

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='__pycache__/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='.env' \
            --exclude='media/' \
            -e "ssh -i ~/.ssh/forooghteb_deploy" \
            ./ \
            "$VPS_USER@$VPS_HOST:/opt/MedicalEquipment-Project/"

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/forooghteb_deploy \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/forooghteb-deploy"